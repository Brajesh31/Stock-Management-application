name: Bug report
description: Report a reproducible frontend or backend defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend
        - Authentication
        - Stock data
        - Build or deployment
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, and personal data.
